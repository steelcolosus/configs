# Configuration file for dotfiles management
configs:
  tmux:
    source: .tmux.conf
    target: ~/.tmux.conf

  wezterm:
    source: .wezterm.lua
    target: ~/.wezterm.lua

  zsh:
    source: .zshrc
    target: ~/.zshrc

  nvim:
    source: nvim
    target: ~/.config/nvim

  ghostty:
    source: ghostty
    target: ~/.config/ghostty

  aerospace:
    source: aerospace
    target: ~/.config/aerospace

  warp:
    source: .warp
    target: ~/.warp
  # Future configs (examples)
  # git:
  #   source: .gitconfig
  #   target: ~/.gitconfig

# Optional post-install commands for specific configs
post_install:
  tmux:
    - "tmux source-file ~/.tmux.conf 2>/dev/null || echo 'Tmux not running, config will apply on next start'"
  nvim:
    - "echo 'Neovim config updated. Restart nvim to apply changes.'"
  zsh:
    - 'echo ''Zsh config updated. Restart your terminal or run "exec zsh" to apply changes.'''
  aerospace:
    - "echo 'Aerospace config installed.'"
    - "aerospace --version"
