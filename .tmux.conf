set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Tc'

# Undercurl
#set -g default-terminal "${TERM}"
#set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
#set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h 

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

set-option -g status-position bottom

bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse


# tpm plugin
set -g @plugin 'tmux-plugins/tpm'



# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
 

#Themes
set -g @plugin 'fabioluciano/tmux-powerkit'

# Choose theme and variant
set -g @powerkit_theme 'tokyo-night'
set -g @powerkit_theme_variant 'night'

# Enable plugins
set -g @powerkit_plugins 'datetime,weather,battery,cpu,memory'

# Auto-detect OS icon
set -g @powerkit_session_icon 'auto'


# --- PowerKit key overrides (covers multiple PowerKit versions) ---

# Choose keys that won’t collide with tokyo-night/resurrect
set -g @powerkit_theme_selector_key 'C-t'
set -g @powerkit_options_viewer_key 'C-o'
set -g @powerkit_keybindings_viewer_key 'C-k'

# Some PowerKit versions read core-scoped names (the ones shown in the conflict log)
set -g @powerkit_plugin_core_theme_selector 'C-t'
set -g @powerkit_plugin_core_options_viewer 'C-o'
set -g @powerkit_plugin_core_keybindings_viewer 'C-k'

# Some versions include the "_key" suffix on the core-scoped names
set -g @powerkit_plugin_core_theme_selector_key 'C-t'
set -g @powerkit_plugin_core_options_viewer_key 'C-o'
set -g @powerkit_plugin_core_keybindings_viewer_key 'C-k'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
